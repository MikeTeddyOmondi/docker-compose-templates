services:
  etcd:
    image: 'bitnami/etcd:3.6'
    container_name: etcd  
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
    #  - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - 2379:2379
      - 2380:2380
    # volumes:
    # - /path/to/etcd.conf.yml:/opt/bitnami/etcd/conf/etcd.conf.yml


