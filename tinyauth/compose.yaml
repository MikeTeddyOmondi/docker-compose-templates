services:
  npm:
    container_name: npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 81:81
    volumes:
      - npm-data:/data
      - letsencrypt:/etc/letsencrypt

  sticky-notes:
    container_name: sticky-notes-app
    image: ranckosolutionsinc/sticky-notes-app:v2.0.0
    restart: unless-stopped
    ports:
      - 127.0.0.1:8000:3000 

  tinyauth:
    container_name: tinyauth
    image: ghcr.io/steveiliop56/tinyauth:v3
    restart: unless-stopped
    environment:
      # generate with openssl rand -base64 32 | tr -dc 'a-zA-Z0-9' | head -c 32
      - SECRET=${SECRET}
      - APP_URL=https://tinyauth.localhost
      # generate with "echo $(htpasswd -nB user) | sed -e s/\\$/\\$\\$/g" - substitute the user with what you want, or use a file
      # - USERS=${USERS}
      - USERS_FILE=users_file # add a file with multiple users in the above format if necessary
      - LOG_LEVEL=0
    #   - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
    #   - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    #   - OAUTH_WHITELIST=${OAUTH_WHITELIST}
    #   - SECRET_FILE=/secret.txt
    #   - APP_URL=http://tinyauth.example.com
    #   - USERS=user:$$2a$$10$$UdLYoJ5lgPsC0RKqYH/jMua7zIn0g9kPqWmhYayJYLaZQ/FTmH2/u # user:password
    volumes:
    - ./users:/tinyauth/users_file

volumes:
  npm-data:
  letsencrypt: